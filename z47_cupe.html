<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="utf-8">
</head>
<body>
    <div style="font-size: 41px;">
        <script language="JavaScript">
            var L_cup = parseFloat(prompt("liczba=",""));
            var koniec_petli_cup = 12;
            if (L_cup%2==0) {
                for (i=1;i<=koniec_petli_cup;i++){
                    document.write("<font color=blue>Cuper"+"</font><br>");
                }
            } else {
                for (i=1;i<=koniec_petli_cup;i++){
                    document.write("<font color=green>Malgorzata"+"</font><br>");
                }
            }
            
        </script>
    </div>
    
</body>
</html>
